## withmcp profile. Uncomment and adapt the entries below.

## Applies to every command server in this profile, so shared variables
## (e.g. from a terminal multiplexer) need not be repeated on each one; a
## server's own env_passthrough adds to this. This must stay above the
## first `[...]` section below, since TOML keys after a table header belong
## to that table.
# env_passthrough = ["MY_TOOL_TOKEN"]

## Servers are off unless they, or a group containing them, have
## `enabled = true`.
# [servers.linear]
# url = "https://mcp.linear.app/mcp"
# enabled = true

# [servers.github]
# url = "https://api.githubcopilot.com/mcp/"
## Values may reference the launching shell's environment with ${VAR}, or
## include the output of a command with $(cmd), e.g.
## `Authorization = "Bearer ${GH_TOKEN}"`.
# headers = { Authorization = "Bearer $(gh auth token)" }

# [servers.playwright]
# command = "npx"
# args = ["@playwright/mcp@latest"]

# [servers.chrome]
# command = "npx"
# args = ["-y", "chrome-devtools-mcp@latest"]
## Codex sandboxes the environment it gives MCP servers; this lets DISPLAY
## through unchanged (Claude and Pi already inherit the full environment,
## so this has no effect there).
# env_passthrough = ["DISPLAY"]

## Groups switch related servers together.
## Like servers, they are not enabled by default.
# [groups.webdev]
# servers = ["playwright", "chrome"]


# [groups.communication]
# servers = ["linear", "slack"]
# enabled = true

## Advanced options

## For servers without dynamic client registration, name the OAuth client
## of your own app. For servers that for whatever reason only support
## confidential clients (*cough* Slack *cough*), use the `withmcp clientsecret`
## subcommand as a one-time setup. This is currently only supported by
## Claude Code.
# [servers.slack]
# url = "https://mcp.slack.com/mcp"
# oauth = { client_id = "<your client id>", callback_port = 3118 }
