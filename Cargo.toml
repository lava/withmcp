[package]
name = "withmcp"
version = "0.1.0"
edition = "2024"
description = "Launch coding-agent harnesses with a configurable set of MCP servers"

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
