[package]
name = "withmcp"
version = "0.1.0"
edition = "2024"
authors = ["Benno Evers <benno@bmevers.de>"]
description = "Launch coding-agent harnesses with a configurable set of MCP servers"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lava/withmcp"
readme = "README.md"
keywords = ["mcp", "claude", "codex", "cli", "agents"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
toml_edit = "0.25.15"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
